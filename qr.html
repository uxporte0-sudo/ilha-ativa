<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>QR Ilha Ativa</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f5f5f5;
}

#qr{
    position:relative;
    width:600px;
    height:600px;
}

.logo-space{
    position:absolute;
    left:50%;
    top:50%;
    width:150px;
    height:150px;
    transform:translate(-50%,-50%);
    background:white;
    border-radius:24px;
    box-shadow:0 0 0 12px white;
}
</style>

</head>
<body>

<div id="qr">
    <div class="logo-space"></div>
</div>

<script>

const url = "https://uxporte0-sudo.github.io/ilha-ativa/";

const qr = qrcode(0, "H"); // H = máxima correção
qr.addData(url);
qr.make();

document.getElementById("qr").insertAdjacentHTML(
    "afterbegin",
    qr.createSvgTag({
        scalable:true,
        margin:4
    })
);

</script>

</body>
</html>
